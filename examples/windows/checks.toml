# Checks shared by hyperv.toml and vsphere.toml (pulled in with `include`).
# Each `run` is PowerShell executed inside the guest; exit code 0 = pass.
# They run before the patch (baseline) and again after the patch and its
# reboots, so only NEW failures count against the patch.

[[deploy]]
src = "tests"
dest = 'C:\PatchLabInternal\tests'

[[checks]]
name = "platform-tests"
category = "functional"
# Pester results are compared test by test (JUnit or NUnit XML both work).
results = 'junit:C:\PatchLabInternal\results\platform.xml'
timeout = 900
run = '''
$ErrorActionPreference = 'Stop'
New-Item -ItemType Directory -Force -Path 'C:\PatchLabInternal\results' | Out-Null
Import-Module Pester -MinimumVersion 3.4.0
$out = 'C:\PatchLabInternal\results\platform.xml'
if ((Get-Module Pester).Version.Major -ge 5) {
    $c = New-PesterConfiguration
    $c.Run.Path = 'C:\PatchLabInternal\tests'
    $c.Run.PassThru = $true
    $c.TestResult.Enabled = $true
    $c.TestResult.OutputFormat = 'JUnitXml'
    $c.TestResult.OutputPath = $out
    $r = Invoke-Pester -Configuration $c
} else {
    $r = Invoke-Pester -Script 'C:\PatchLabInternal\tests' -OutputFile $out -OutputFormat NUnitXml -PassThru
}
exit $r.FailedCount
'''

[[checks]]
name = "boot-to-usable"
category = "smoke"
# Fails if the desktop/session stack or core networking is not up.
run = '''
$ErrorActionPreference = 'Stop'
$ip = Get-NetIPAddress -AddressFamily IPv4 | Where-Object { $_.IPAddress -notlike '127.*' -and $_.IPAddress -notlike '169.254.*' }
if (-not $ip) { Write-Output 'no usable IPv4 address'; exit 1 }
if (-not (Resolve-DnsName -Name localhost -ErrorAction SilentlyContinue)) { Write-Output 'DNS client cannot resolve localhost'; exit 1 }
Write-Output "ok: $($ip.IPAddress -join ', ')"
'''

[[checks]]
name = "windows-update-agent"
category = "os"
critical = false
# Next month's patching depends on the update stack still working.
run = '''
$s = New-Object -ComObject Microsoft.Update.Session
$h = $s.QueryHistory(0, 20) | Where-Object { $_.ResultCode -ge 4 }
Get-Service wuauserv | Select-Object Name, Status, StartType | Format-Table | Out-String | Write-Output
if ($h) { $h | ForEach-Object { Write-Output "failed: $($_.Title) 0x$('{0:X8}' -f $_.HResult)" } }
exit 0
'''

