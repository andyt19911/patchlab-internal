# The estate PatchLab Internal maintains. See docs/DESIGN.md §3.1.
#
# Every value here reaches a sandbox, so it may hold only throwaway test
# values: `estate validate` refuses anything that looks like a real credential.
# Host-specific settings come from the environment:
#   PATCHLAB_INTERNAL_ESTATE_WORKDIR  where clones, mirrors and state live
#   PATCHLAB_INTERNAL_CA_BUNDLE       a CA bundle to trust (TLS-inspecting proxies)

[estate]
workdir = "~/.local/share/patchlab-internal/estate"
publish = "report-only"          # M4 turns on "draft-pr"

# The coding agent `estate repair` hands failing tests to (docs/DESIGN.md §4.5).
# Off until the runner has an agent credential: its name goes in `env`, its
# value only in the runner's environment. Uncomment on the runner host.
#
# [repair]
# image   = "node:22-bookworm"
# setup   = ["npm install -g @anthropic-ai/claude-code"]
# command = """claude -p "$(cat /tmp/patchlab-brief.md)" --permission-mode acceptEdits \
#   --allowedTools Read Edit Write Glob Grep 'Bash(git diff:*)' 'Bash(git status:*)' 'Bash(ls:*)'"""
# env     = ["ANTHROPIC_API_KEY"]
# timeout = 2700

# Private git dependencies. The host fetches them with its own credentials;
# sandboxes get a read-only copy and never see a token.
[[mirror]]
name = "streamly-security-core"
url  = "https://github.com/MIIMAGINELabs/streamly-security-core"

# ---------------------------------------------------------------- subsovereign
# Code scanning (`estate code-scan`): Opengrep runs these rule directories, read from the
# estate's own repos at their branch heads. Caer's rules are clean-room and owned by
# MIIMAGINE AI LTD (caer rulesets/opengrep/README.md). bandit (Python) and gosec (Go) run too.
[sast]
rules = ["caer:rulesets/opengrep"]

[[repo]]
name   = "subsovereign"
url    = "https://github.com/StreamlyApps/subsovereign"
branch = "main"

  [[repo.package]]
  path      = "backend"
  ecosystem = "npm"
  # What the repo ships and its CI pins (Node 20; Node 18 crashes vitest).
  # The full image, not -slim: it has git, which npm needs for the mirror.
  image     = "node:20-bookworm"
  install   = ["npm ci --no-audit --no-fund"]
  mirrors   = ["streamly-security-core"]
  check_network = "isolated"
  memory    = "6g"
  not_covered = [
    "Real mail delivery: platform-relay.test.ts sends through an in-process SMTP sink, not the production relay.",
    "The live AI path (ai-provider.test.ts skips itself without MERLYN_SECRET), as in the repo's own CI.",
    "The sovereign-twin drift guard (twin-interview-parity.test.ts skips without the Rust crate checked out).",
  ]
  cpus      = "4"

    # The same throwaway values as .github/workflows/backend.yml.
    [repo.package.env]
    CI               = "true"
    NODE_ENV         = "test"
    DATABASE_URL     = "postgresql://postgres:postgres@postgres:5432/postgres"
    REDIS_URL        = "redis://redis:6379"
    JWT_SECRET       = "ci-jwt-secret-for-tests-only-32-chars-min"
    API_KEY_SALT     = "ci-api-key-salt-for-tests-only-32chars"
    ENCRYPTION_KEY   = "0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef"
    APPLE_BUNDLE_ID  = "test.bundle"

    # global-setup.ts uses DROP DATABASE ... WITH (FORCE): Postgres 13 or newer.
    [[repo.package.sidecars]]
    name   = "postgres"
    image  = "postgres:16"
    env    = { POSTGRES_USER = "postgres", POSTGRES_PASSWORD = "postgres", POSTGRES_DB = "postgres" }
    health = "pg_isready -U postgres"

    [[repo.package.sidecars]]
    name   = "redis"
    image  = "redis:7"
    health = "redis-cli ping"

    [[repo.package.checks]]
    name     = "typecheck"
    run      = "npx tsc --noEmit"
    category = "build"

    # CI's "the spec must be reproducible from the registry" step.
    [[repo.package.checks]]
    name     = "openapi-reproducible"
    run      = "npm run openapi >/dev/null && git diff --exit-code -- openapi.json; rc=$?; git checkout -- openapi.json; exit $rc"
    category = "build"

    # npm test runs this as `pretest`; run explicitly because the suites below call vitest directly.
    [[repo.package.checks]]
    name = "fixture-ids"
    run  = "npm run check:fixtures"

    [[repo.package.checks]]
    name    = "unit-tests"
    run     = "npx vitest run --exclude '**/audit-chain.test.ts' --reporter=default --reporter=junit --outputFile.junit=/tmp/unit.junit.xml"
    results = "junit:/tmp/unit.junit.xml"
    timeout = 2400

    [[repo.package.checks]]
    name    = "audit-chain"
    run     = "npx vitest run src/__tests__/audit-chain.test.ts --reporter=default --reporter=junit --outputFile.junit=/tmp/chain.junit.xml"
    results = "junit:/tmp/chain.junit.xml"

  [[repo.package]]
  path        = "sdk-ios"
  ecosystem   = "swift"
  unsupported = "needs a macOS runner (swift test / xcodebuild)"

# ------------------------------------------------------------------- latticeiq
  # Dockerfiles: base images scanned with Trivy; a runtime past end of life is
  # moved to a supported line and tested through the linked package's checks.
  [[repo.image]]
  dockerfile = "backend/Dockerfile"
  package    = "backend"

  [[repo.image]]
  dockerfile = "dashboard/Dockerfile"
  context    = "."            # it copies sdk-react/ and docs/ from the repo root

  [[repo.image]]
  dockerfile = "deploy/haraka/Dockerfile"

[[repo]]
name   = "latticeiq"
url    = "https://github.com/MIIMAGINELabs/latticeiq"
branch = "main"

  # The same steps and throwaway values as the backend job in .github/workflows/ci.yml.
  [[repo.package]]
  path      = "backend"
  ecosystem = "python"
  image     = "python:3.14-bookworm"
  install   = ["pip install --no-cache-dir --disable-pip-version-check -r requirements-dev.txt"]
  memory    = "4g"
  not_covered = [
    "Live TLS and SSH probes: the tests stub the scanner binary, and checks run with no network.",
    "The API container image (CI's image job builds backend/Dockerfile; this runs the source).",
    "Two netguard tests that resolve public names (one.one.one.one, example.com): deselected, because checks have no DNS.",
  ]

    [repo.package.env]
    APP_ENV           = "test"
    APP_SECRET_KEY    = "ci-only-not-a-real-secret"
    DATABASE_URL      = "postgresql+asyncpg://latticeiq_app:ci-app-password-000@postgres:5432/latticeiq"
    DATABASE_SYSTEM_URL = "postgresql+asyncpg://latticeiq_system:ci-system-password-000@postgres:5432/latticeiq"
    DATABASE_SYNC_URL = "postgresql+psycopg2://latticeiq:latticeiq@postgres:5432/latticeiq"
    REDIS_URL         = "redis://localhost:6379/0"
    API_KEY_PEPPER    = "ci0only0pepper0000000000000000000000000000000000000000000000000"
    REQUIRE_DB_TESTS  = "1"

    [[repo.package.sidecars]]
    name   = "postgres"
    image  = "postgres:18-alpine"
    env    = { POSTGRES_USER = "latticeiq", POSTGRES_PASSWORD = "latticeiq", POSTGRES_DB = "latticeiq" }
    health = "pg_isready -U latticeiq"

    [[repo.package.checks]]
    name     = "migrations-apply"
    run      = "alembic upgrade head"
    category = "build"

    [[repo.package.checks]]
    name     = "migrations-reversible"
    run      = "alembic downgrade base && alembic upgrade head"
    category = "build"

    [[repo.package.checks]]
    name     = "models-match-migrations"
    run      = "alembic check"
    category = "build"

    [[repo.package.checks]]
    name     = "provision-rls-roles"
    run      = "python -m scripts.provision_db_roles --app-password ci-app-password-000 --system-password ci-system-password-000"
    category = "build"

    [[repo.package.checks]]
    name    = "tests"
    run     = "python -m pytest tests/ -q -p no:cacheprovider --junitxml=/tmp/pytest.junit.xml --deselect tests/test_security.py::test_a_resolved_target_is_pinned --deselect tests/test_security.py::test_tls_ports_are_allowed"
    results = "junit:/tmp/pytest.junit.xml"
    timeout = 1800

  [[repo.package]]
  path      = "scanner-agent"
  ecosystem = "go"
  # go.mod asks for Go 1.27; GOTOOLCHAIN=local stops go from fetching another one mid-check.
  image     = "golang:1.27-bookworm"
  install   = ["go mod download"]
  env       = { GOTOOLCHAIN = "local", GOFLAGS = "-mod=readonly" }
  not_covered = ["Probes against live hosts: the checks run with no network."]

    [[repo.package.checks]]
    name     = "build"
    run      = "go build ./..."
    category = "build"

    [[repo.package.checks]]
    name     = "vet"
    run      = "go vet ./..."
    category = "build"

    [[repo.package.checks]]
    name    = "tests"
    run     = "go test -count=1 ./..."
    timeout = 1200

  [[repo.package]]
  path      = "frontend"
  ecosystem = "npm"
  image     = "node:24-bookworm"
  install   = ["npm ci --no-audit --no-fund"]

    [[repo.package.checks]]
    name     = "typecheck"
    run      = "npx tsc --noEmit"
    category = "build"

    [[repo.package.checks]]
    name    = "tests"
    run     = "npx vitest run --reporter=default --reporter=junit --outputFile.junit=/tmp/vitest.junit.xml"
    results = "junit:/tmp/vitest.junit.xml"

    [[repo.package.checks]]
    name     = "production-build"
    run      = "npm run build"
    category = "build"

# ------------------------------------------------------ streamly-security-core
  [[repo.image]]
  dockerfile = "backend/Dockerfile"
  context    = "."            # it builds scanner-agent/ too
  package    = "backend"

[[repo]]
name   = "streamly-security-core"
url    = "https://github.com/MIIMAGINELabs/streamly-security-core"
branch = "main"

  [[repo.package]]
  path      = "."
  ecosystem = "npm"
  # CI runs Node 20, 22 and 24. The gate runs one image, so it uses 24: the
  # only one whose OpenSSL (3.5) has ML-KEM, which the cross-check tests need.
  image     = "node:24-bookworm"
  install   = ["npm ci --no-audit --no-fund"]
  not_covered = ["Node 20 and 22, which the repo's CI matrix also runs."]

    [[repo.package.checks]]
    name = "tests"
    run  = "npm test"

    [[repo.package.checks]]
    name = "enterprise-tests"
    run  = "npm run test:enterprise"

# ------------------------------------------------------------------------ caer
[[repo]]
name   = "caer"
url    = "https://github.com/MIIMAGINELabs/caer"
branch = "main"

  [[repo.package]]
  path      = "packages/orchestrator"
  ecosystem = "npm"
  image     = "node:20-bookworm"
  install   = ["npm ci --no-audit --no-fund"]
  not_covered = ["The scan engines themselves (Opengrep and friends run in their own images)."]

    [[repo.package.checks]]
    name     = "typecheck"
    run      = "npm run typecheck"
    category = "build"

    # TAP gives the gate one result per test, not just the exit code.
    [[repo.package.checks]]
    name    = "tests"
    run     = "NODE_OPTIONS=--test-reporter=tap npm test"
    results = "tap"

  # The repo has no tests for the console, only a typecheck. PatchLab adds a
  # production build and a browser smoke check (patchlab_internal/assets/
  # browser_smoke.mjs): every route loads in headless Chromium, must render,
  # and must throw nothing uncaught. The browser is a sidecar, so nothing is
  # installed into the app.
  [[repo.package]]
  path      = "packages/admin-console"
  ecosystem = "npm"
  image     = "node:20-bookworm"
  install   = ["npm ci --no-audit --no-fund"]
  not_covered = [
    "Signed-in behaviour: there is no API in the sandbox, so every route renders signed out (the login screen).",
    "Interaction beyond loading each route: there are no tests that click through the console.",
  ]

    [[repo.package.sidecars]]
    name    = "browser"
    image   = "mcr.microsoft.com/playwright:v1.55.0-noble"
    # Headless Chromium binds DevTools to loopback only, whatever the flags say,
    # so a small forwarder in the same container exposes it to the sandbox.
    command = ["bash", "-c", """
      /ms-playwright/chromium_headless_shell-1187/chrome-linux/headless_shell --no-sandbox --disable-gpu \
        --remote-debugging-port=9223 about:blank &
      exec node -e "const net = require('net');
        net.createServer((c) => { const u = net.connect(9223, '127.0.0.1');
          c.pipe(u).pipe(c); u.on('error', () => c.destroy()); c.on('error', () => u.destroy()); })
        .listen(9222, '0.0.0.0')"
    """]
    health  = "bash -c 'echo > /dev/tcp/127.0.0.1/9223 && echo > /dev/tcp/127.0.0.1/9222'"
    memory  = "2g"

    [[repo.package.checks]]
    name     = "typecheck"
    run      = "npm run typecheck"
    category = "build"

    [[repo.package.checks]]
    name     = "build"
    run      = "npm run build"
    category = "build"

    [[repo.package.checks]]
    name    = "browser-smoke"
    run     = "npx vite preview --host 0.0.0.0 --port 4173 --strictPort >/tmp/preview.log 2>&1 & pid=$!; node /opt/patchlab/tools/browser_smoke.mjs --url http://app:4173 --browser browser:9222 / /orgs /fleet /audit-log /ai-router; rc=$?; kill $pid; exit $rc"
    results = "tap"

  # The migrations job in .github/workflows/ci.yml. The sandbox is a Postgres
  # image only for its psql client; the database is the sidecar.
  [[repo.package]]
  path      = "packages/shared-schema"
  ecosystem = "sql"
  image     = "postgres:16"
  env       = { PGHOST = "postgres", PGUSER = "postgres", PGPASSWORD = "postgres", PGDATABASE = "caer" }

    [[repo.package.sidecars]]
    name   = "postgres"
    image  = "postgres:16-alpine"
    env    = { POSTGRES_USER = "postgres", POSTGRES_PASSWORD = "postgres", POSTGRES_DB = "caer" }
    health = "pg_isready -U postgres"

    # Run from the repo root, as CI does: the data-migration tests \i the
    # migrations by their repo-relative path. Each run starts from an empty
    # database, so a re-run can't pass on leftovers.
    [[repo.package.checks]]
    name     = "migrations-from-empty"
    run      = "cd ../.. && psql -v ON_ERROR_STOP=1 -q -c 'DROP SCHEMA public CASCADE; CREATE SCHEMA public;' && for f in $(ls packages/shared-schema/migrations/*.sql | sort); do echo \"== $f\"; psql -v ON_ERROR_STOP=1 -q -f \"$f\" || exit 1; done"
    category = "build"

    [[repo.package.checks]]
    name = "data-migrations"
    run  = "cd ../.. && for f in $(ls packages/shared-schema/tests/*.sql 2>/dev/null | sort); do echo \"== $f\"; psql -v ON_ERROR_STOP=1 -q -f \"$f\" || exit 1; done"

    [[repo.package.checks]]
    name = "orchestrator-schema"
    run  = "psql -v ON_ERROR_STOP=1 -tA -c \"SELECT CASE WHEN count(*) = 1 THEN 'ok' ELSE 'missing scans.pushed_at (migration 007)' END FROM information_schema.columns WHERE table_name = 'scans' AND column_name = 'pushed_at'\" | tee /dev/stderr | grep -qx ok"

# -------------------------------------------------------------------- sentinel
  [[repo.image]]
  dockerfile = "infra/images/jscpd/Dockerfile"

  [[repo.image]]
  dockerfile = "infra/images/opengrep/Dockerfile"

[[repo]]
name   = "sentinel"
url    = "https://github.com/MIIMAGINELabs/sentinel"
branch = "main"

  [[repo.package]]
  path      = "apps/proxy"
  ecosystem = "python"
  # The proxy's Dockerfile and pip-audit workflow both use Python 3.11.
  image     = "python:3.11-bookworm"
  # requirements.txt has no test tools; these are the ones CLAUDE.md names.
  install   = ["pip install --no-cache-dir --disable-pip-version-check -r requirements.txt pytest pytest-asyncio"]
  not_covered = ["The Next.js dashboard (no lockfile, so it can't be installed reproducibly)."]

    [[repo.package.checks]]
    name    = "tests"
    run     = "python -m pytest tests/ -q -p no:cacheprovider --junitxml=/tmp/pytest.junit.xml"
    results = "junit:/tmp/pytest.junit.xml"

# ---------------------------------------------------------------------- sentry
  [[repo.image]]
  dockerfile = "apps/proxy/Dockerfile"
  package    = "apps/proxy"

  [[repo.image]]
  dockerfile = "apps/dashboard/Dockerfile"

[[repo]]
name   = "sentry"
url    = "https://github.com/MIIMAGINELabs/sentry"
branch = "master"

  # No CI in the repo yet; these are the commands BUILD.md reports as passing.
  [[repo.package]]
  path      = "."
  ecosystem = "cargo"
  image     = "rust:1-bookworm"
  install   = ["cargo fetch --locked"]
  memory    = "6g"
  cpus      = "4"
  not_covered = ["OpenBao: the tests use the in-process secret store, not a live OpenBao."]

    [[repo.package.checks]]
    name     = "build"
    run      = "cargo build --workspace --locked --all-targets"
    category = "build"
    timeout  = 2400

    [[repo.package.checks]]
    name    = "tests"
    run     = "cargo test --workspace --locked --no-fail-fast"
    timeout = 1800
