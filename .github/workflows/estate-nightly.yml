# The estate's nightly cycle: sync the six repos, run every package's checks, scan
# dependencies, images, code and CI, build and test fixes, and write the digest.
#
# Secrets (repository settings → Secrets and variables → Actions). A fine-grained token
# covers one owner, so there is one per owner; each needs Contents: read on its repos.
# Draft PRs (publish = "draft-pr" in estate.toml) also need Contents: write and
# Pull requests: write on them.
#   PATCHLAB_TOKEN_STREAMLYAPPS   StreamlyApps/subsovereign
#   PATCHLAB_TOKEN_MIIMAGINELABS  MIIMAGINELabs/{latticeiq, streamly-security-core, caer, sentinel, sentry}
#   ANTHROPIC_API_KEY             the analyst and operator agents, and [repair] if configured
#
# Which repos: the repository variable PATCHLAB_ESTATE_REPOS (comma-separated, or "all").
# Unset, it is latticeiq only, while the first runs are watched (Andy, 2026-09-28); that
# needs only PATCHLAB_TOKEN_MIIMAGINELABS (latticeiq, plus caer for the code-scanning rules).
#
# The agents (docs/DESIGN.md §4.9, §4.10) run after the cycle, only while the cycle
# covers latticeiq alone, and only on latticeiq: PATCHLAB_INTERNAL_AGENT_REPOS is fixed
# here, not a variable, and their tools and the guard enforce it. The analyst writes
# the night's analysis; the operator queues retries, writes reviewer briefs and may
# change PatchLab itself, which becomes a draft PR on an operator/ branch here after
# it passes the guard and the tests in a job without secrets. Without ANTHROPIC_API_KEY
# they are skipped; the repository variable PATCHLAB_AGENTS = "off" stops them too.
# For the draft PR, Settings -> Actions -> General must allow Actions to create PRs.
#
# State (the last health runs, what was published) carries over between runs in the
# Actions cache; the digest is the run's summary and an artifact.
name: Estate nightly

on:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:
    inputs:
      no_propose:
        description: "Health and digest only"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: estate-nightly
  cancel-in-progress: false

jobs:
  cycle:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    outputs:
      operator_change: ${{ steps.operator.outputs.change }}
      operator_base: ${{ steps.operator.outputs.base }}
    env:
      PATCHLAB_INTERNAL_ESTATE_WORKDIR: ${{ github.workspace }}/.estate
      ESTATE_REPOS: ${{ vars.PATCHLAB_ESTATE_REPOS || 'latticeiq' }}
      PATCHLAB_INTERNAL_GITHUB_TOKEN_STREAMLYAPPS: ${{ secrets.PATCHLAB_TOKEN_STREAMLYAPPS }}
      PATCHLAB_INTERNAL_GITHUB_TOKEN_MIIMAGINELABS: ${{ secrets.PATCHLAB_TOKEN_MIIMAGINELABS }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      PATCHLAB_INTERNAL_TRIVY_IMAGE: mirror.gcr.io/aquasec/trivy:0.74.0
      PATCHLAB_INTERNAL_DOCKERHUB_MIRROR: mirror.gcr.io
      PATCHLAB_INTERNAL_AGENT_REPOS: latticeiq
      AGENT_BUDGET_USD: ${{ vars.PATCHLAB_AGENT_BUDGET_USD || '5' }}
      CLAUDE_CODE_VERSION: 2.1.284
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Make room for the sandbox images
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          docker system prune -af >/dev/null
          df -h /
      - name: Install PatchLab Internal
        run: python -m pip install -e .
      - name: Check the tokens are there
        run: |
          missing=""
          case ",$ESTATE_REPOS," in
            *,all,*|*,subsovereign,*)
              [ -n "$PATCHLAB_INTERNAL_GITHUB_TOKEN_STREAMLYAPPS" ] || missing="$missing PATCHLAB_TOKEN_STREAMLYAPPS" ;;
          esac
          [ -n "$PATCHLAB_INTERNAL_GITHUB_TOKEN_MIIMAGINELABS" ] || missing="$missing PATCHLAB_TOKEN_MIIMAGINELABS"
          if [ -n "$missing" ]; then echo "::error::Add these repository secrets:$missing"; exit 1; fi
          python -m patchlab_internal estate validate
      - name: Restore state
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ env.PATCHLAB_INTERNAL_ESTATE_WORKDIR }}/state
          key: estate-state-${{ github.run_id }}
          restore-keys: estate-state-
      - name: Cycle
        id: cycle
        run: |
          if [ "$ESTATE_REPOS" != "all" ]; then export PATCHLAB_INTERNAL_ESTATE_REPOS="$ESTATE_REPOS"; fi
          # The analyst's watch: a warning on the run for a step far past its usual time.
          python -m patchlab_internal estate analyst watch --follow 60 > watch.log 2>&1 &
          watcher=$!
          python -m patchlab_internal estate cycle ${{ inputs.no_propose && '--no-propose' || '' }} | tee digest-path.txt
          wait "$watcher" || true
          cat watch.log
      - name: Agent tools
        id: agents
        if: >-
          !cancelled() && steps.cycle.outcome != 'skipped' && env.ANTHROPIC_API_KEY != ''
          && env.ESTATE_REPOS == 'latticeiq' && vars.PATCHLAB_AGENTS != 'off'
        run: |
          # Installed from this commit, before either agent runs, and never editable.
          tools="$RUNNER_TEMP/agents/tools"
          python -m venv "$tools/venv"
          "$tools/venv/bin/pip" install --quiet . pyflakes
          npm install --silent --no-fund --prefix "$tools/node" "@anthropic-ai/claude-code@$CLAUDE_CODE_VERSION"
          echo "ok=true" >> "$GITHUB_OUTPUT"
      - name: Analyst agent
        if: steps.agents.outputs.ok == 'true'
        continue-on-error: true
        run: |
          .github/agents/run.sh analyst \
            "patchlab-internal estate analyst watch" \
            "patchlab-internal estate analyst trends:*" \
            "patchlab-internal estate analyst explain:*" \
            "patchlab-internal estate analyst report:*" \
            "patchlab-internal estate operator status"
      - name: Take the analysis
        if: steps.agents.outputs.ok == 'true'
        run: python -m patchlab_internal estate operator import-results "$RUNNER_TEMP/agents/analyst/estate"
      - name: Operator agent
        id: operator
        if: steps.agents.outputs.ok == 'true'
        continue-on-error: true
        run: |
          .github/agents/run.sh operator \
            "patchlab-internal estate operator status" \
            "patchlab-internal estate operator discover" \
            "patchlab-internal estate operator tools" \
            "patchlab-internal estate operator brief:*" \
            "patchlab-internal estate operator request-retry:*" \
            "python -m pyflakes:*"
          d="$RUNNER_TEMP/agents/operator"
          echo "base=$(cat "$d/base.txt")" >> "$GITHUB_OUTPUT"
          if [ -s "$d/operator.patch" ]; then echo "change=true" >> "$GITHUB_OUTPUT"; fi
      - name: Take the briefs and retries
        if: steps.agents.outputs.ok == 'true'
        run: |
          python -m patchlab_internal estate operator import-results "$RUNNER_TEMP/agents/operator/estate"
          python -m patchlab_internal estate operator run-requests
          python -m patchlab_internal estate digest -q
      - name: Keep the operator's change
        if: steps.operator.outputs.change == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: operator-change
          path: |
            ${{ runner.temp }}/agents/operator/operator.patch
            ${{ runner.temp }}/agents/operator/summary.md
          retention-days: 14
      - name: Digest
        if: always()
        run: |
          d=$(ls -t "$PATCHLAB_INTERNAL_ESTATE_WORKDIR"/state/digest/*.md 2>/dev/null | head -1)
          if [ -n "$d" ]; then cat "$d" >> "$GITHUB_STEP_SUMMARY"; cp "$d" digest.md; fi
      - name: Save state
        if: always()
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ env.PATCHLAB_INTERNAL_ESTATE_WORKDIR }}/state
          key: estate-state-${{ github.run_id }}
      # The results without the raw test logs; unzipped into a folder named state,
      # the web front end's Estate page shows them (web/README.md).
      - name: Upload the results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: estate-${{ github.run_id }}
          path: |
            ${{ env.PATCHLAB_INTERNAL_ESTATE_WORKDIR }}/state
            !${{ env.PATCHLAB_INTERNAL_ESTATE_WORKDIR }}/state/**/runs/**
            !${{ env.PATCHLAB_INTERNAL_ESTATE_WORKDIR }}/state/.lock
          retention-days: 30
          if-no-files-found: warn
      - name: Leave nothing running
        if: always()
        run: |
          docker ps -aq --filter label=patchlab_internal=1 | xargs -r docker rm -f
          docker network ls -q --filter label=patchlab_internal=1 | xargs -r docker network rm

  # The operator's change to PatchLab, checked with no secrets and a read-only token:
  # the guard (from the base commit's code) refuses protected files, estate.toml
  # changes it may not make and anything outside latticeiq; then the full tests.
  operator-test:
    needs: cycle
    if: needs.cycle.outputs.operator_change == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      PATCHLAB_INTERNAL_AGENT_REPOS: latticeiq
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.cycle.outputs.operator_base }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: operator-change
          path: ${{ runner.temp }}/change
      - name: Base tools
        run: |
          python -m venv "$RUNNER_TEMP/base"
          "$RUNNER_TEMP/base/bin/pip" install --quiet . pyflakes
      - name: Apply the change
        run: |
          git apply --index "$RUNNER_TEMP/change/operator.patch"
          git -c user.name="PatchLab Internal operator" -c user.email="operator@patchlab.invalid" \
            commit --quiet -m "Operator change"
      - name: Guard
        run: '"$RUNNER_TEMP/base/bin/patchlab-internal" estate operator guard --base HEAD~1'
      - name: Lint
        run: '"$RUNNER_TEMP/base/bin/python" -m pyflakes patchlab_internal tests web'
      - name: Tests
        run: |
          python -m pip install --quiet -e .
          python -m unittest discover -s tests
          python -m unittest discover -s web/tests

  # Opens the draft PR. It runs no code from the change: git apply, git push, gh.
  operator-pr:
    needs: [cycle, operator-test]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.cycle.outputs.operator_base }}
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: operator-change
          path: ${{ runner.temp }}/change
      - name: Open the draft PR
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: operator/${{ github.run_id }}
          BASE: ${{ github.event.repository.default_branch }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          git apply --index "$RUNNER_TEMP/change/operator.patch"
          git -c user.name="PatchLab Internal operator" -c user.email="operator@patchlab.invalid" \
            commit --quiet -m "Operator: nightly fixes from run ${{ github.run_id }}"
          auth=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
          git -c http.https://github.com/.extraheader="AUTHORIZATION: basic $auth" push origin "HEAD:refs/heads/$BRANCH"
          { echo "Opened by the operator agent after the nightly run. It passed the guard, lint and the tests in [the run]($RUN_URL); CI does not start on its own for a PR opened by Actions."
            echo; cat "$RUNNER_TEMP/change/summary.md"; } > body.md
          gh pr create --draft --base "$BASE" --head "$BRANCH" --title "Operator: nightly fixes ($(date -u +%F))" --body-file body.md
